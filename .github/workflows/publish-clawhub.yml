name: Publish ClawHub

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate before publish
        run: |
          npm test
          npm run ci:guardrails

      - name: Install ClawHub CLI
        run: npm i -g clawhub

      - name: Publish to ClawHub
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: |
          VERSION=$(node -e 'console.log(JSON.parse(require("node:fs").readFileSync("package.json","utf8")).version)')
          clawhub publish . --slug consensus-interact --name "consensus-interact" --version "$VERSION" --changelog "Automated publish from main"
